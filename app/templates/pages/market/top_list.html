{% extends "layouts/sidebar.html" %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="container p-6">
    <!-- Page header -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <i class="fas fa-trophy text-yellow-500"></i>
            {{ page_title }}
        </h1>
        <p class="text-gray-600 mt-2">{{ page_description }}</p>
    </div>

    <!-- Data filters -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fas fa-filter text-blue-500"></i>
            筛选条件
        </h3>
        <form hx-get="/htmx/market/top-list" 
              hx-target="#data-container"
              hx-indicator="#loading"
              class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">日期</label>
                <input type="date" 
                       name="date"
                       id="date-input"
                       class="form-input">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">交易所</label>
                <select name="exchange" class="form-select">
                    <option value="">全部</option>
                    <option value="sh">上交所</option>
                    <option value="sz">深交所</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="btn-primary w-full">
                    <i class="fas fa-search mr-2"></i>查询数据
                </button>
            </div>
        </form>
        
        <!-- Auto-load data on page load -->
        <button hx-get="/htmx/market/top-list" 
                hx-target="#data-container"
                hx-indicator="#loading"
                hx-trigger="load"
                class="hidden">Auto Load</button>
    </div>

    <!-- Data display area -->
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fas fa-table text-green-500"></i>
            龙虎榜数据
        </h3>
        
        <!-- Loading indicator -->
        <div id="loading" class="hidden">
            <div class="flex items-center justify-center py-8">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <span class="ml-3 text-gray-600">正在加载数据...</span>
            </div>
        </div>

        <!-- Data table placeholder -->
        <div id="data-container">
            <div class="text-center py-12 text-gray-500">
                <i class="fas fa-chart-bar text-4xl mb-4"></i>
                <p>正在加载龙虎榜数据...</p>
            </div>
        </div>
    </div>
</div>

<!-- Simple page setup script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set default date to today
    const dateInput = document.getElementById('date-input');
    if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
    }
});
</script>
{% endblock %}
