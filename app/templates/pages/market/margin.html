{% extends "layouts/dashboard.html" %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="page-container">
    <!-- Page header -->
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-balance-scale icon-primary"></i>
            {{ page_title }}
        </h1>
        <p class="page-description">{{ page_description }}</p>
    </div>

    <!-- Data filters -->
    <div class="filter-section">
        <div class="form-container">
            <h3 class="filter-title">
                <i class="fas fa-filter icon-primary"></i>
                筛选条件
            </h3>
            <form hx-get="/htmx/market/margin" 
                  hx-target="#data-container"
                  hx-indicator="#loading"
                  class="form-grid">
                <div class="form-field">
                    <label class="form-label">日期</label>
                    <input type="date" 
                           name="date"
                           id="date-input"
                           class="form-input">
                </div>
                <div class="form-field">
                    <label class="form-label">交易所</label>
                    <select name="exchange" class="form-select">
                        <option value="">全部</option>
                        <option value="sh">上交所</option>
                        <option value="sz">深交所</option>
                    </select>
                </div>
                <div class="form-field">
                    <label class="form-label">&nbsp;</label>
                    <button type="submit" class="btn-primary btn-icon btn-full">
                        <i class="fas fa-search"></i>查询数据
                    </button>
                </div>
            </form>
        
            <!-- Auto-load data on page load -->
            <button hx-get="/htmx/market/margin" 
                    hx-target="#data-container"
                    hx-indicator="#loading"
                    hx-trigger="load"
                    class="hidden">Auto Load</button>
        </div>
    </div>

    <!-- Summary Statistics -->
    <div id="summary-container" class="card-spaced">
        <!-- Summary will be loaded here by HTMX -->
    </div>

    <!-- Data display area -->
    <div class="data-section card">
        <h3 class="data-title">
            <i class="fas fa-table icon-success"></i>
            融资融券数据
        </h3>
        
        <!-- Loading indicator -->
        <div id="loading" class="loading-indicator hidden">
            <div class="loading-spinner"></div>
            <span class="loading-text">正在加载数据...</span>
        </div>

        <!-- Data table placeholder -->
        <div id="data-container">
            <div class="empty-state">
                <i class="fas fa-chart-bar text-4xl mb-4"></i>
                <p>正在加载融资融券数据...</p>
            </div>
        </div>
    </div>
</div>

<!-- Simple page setup script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set default date to today
    const dateInput = document.getElementById('date-input');
    if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
    }
});
</script>
{% endblock %}
