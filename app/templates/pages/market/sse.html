{% extends "layouts/sidebar.html" %}

{% block content %}
<div class="container p-6">
    <!-- Page header -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <i class="fas fa-building text-blue-500"></i>
            {{ page_title }}
        </h1>
        <p class="text-gray-600 mt-2">{{ page_description }}</p>
    </div>

    <!-- Dynamic content loading area for summary statistics -->
    <div id="sse-summary" class="mb-6">
        <div class="bg-white rounded-xl shadow-lg p-6 text-center">
            <div class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm rounded-md text-gray-500 bg-white">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 818-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 714 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                正在加载上交所市场概览数据...
            </div>
        </div>
    </div>

    <!-- Control panel -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 text-gray-600">
                <i class="fas fa-info-circle"></i>
                <span class="text-sm">上海证券交易所市场总貌实时数据</span>
            </div>
            <button 
                class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                hx-get="{{ url_for('views.htmx_market_sse') }}"
                hx-target="#sse-table"
                hx-indicator="#loading">
                <i class="fas fa-refresh mr-2"></i>
                刷新数据
            </button>
        </div>
    </div>

    <!-- Dynamic content loading area for data table -->
    <div id="sse-table" hx-get="{{ url_for('views.htmx_market_sse') }}" 
         hx-trigger="load"
         hx-indicator="#loading">
        <div id="loading" class="bg-white rounded-xl shadow-lg p-6 text-center">
            <div class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm rounded-md text-gray-500 bg-white">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 818-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 714 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                正在加载上交所市场数据...
            </div>
        </div>
    </div>
</div>
{% endblock %}
