{% extends "layouts/sidebar.html" %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="container p-6">
    <!-- Page header -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <i class="fas fa-chart-area text-blue-500"></i>
            {{ page_title }}
        </h1>
        <p class="text-gray-600 mt-2">{{ page_description }}</p>
    </div>

    <!-- Market overview -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl shadow-lg p-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-blue-100 text-sm">总成交金额</p>
                    <p class="text-2xl font-bold">0.00万亿</p>
                </div>
                <i class="fas fa-coins text-3xl text-blue-200"></i>
            </div>
        </div>
        <div class="bg-gradient-to-r from-green-500 to-green-600 rounded-xl shadow-lg p-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-green-100 text-sm">上涨家数</p>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <i class="fas fa-arrow-up text-3xl text-green-200"></i>
            </div>
        </div>
        <div class="bg-gradient-to-r from-red-500 to-red-600 rounded-xl shadow-lg p-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-red-100 text-sm">下跌家数</p>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <i class="fas fa-arrow-down text-3xl text-red-200"></i>
            </div>
        </div>
        <div class="bg-gradient-to-r from-gray-500 to-gray-600 rounded-xl shadow-lg p-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-100 text-sm">平盘家数</p>
                    <p class="text-2xl font-bold">0</p>
                </div>
                <i class="fas fa-minus text-3xl text-gray-200"></i>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">成交金额趋势</h3>
            <canvas id="volumeChart"></canvas>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">指数走势</h3>
            <canvas id="indexChart"></canvas>
        </div>
    </div>

    <!-- Data filters and table -->
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fas fa-filter text-blue-500"></i>
            数据查询
        </h3>
        <form class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">开始日期</label>
                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">结束日期</label>
                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">数据类型</label>
                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="daily">日统计</option>
                    <option value="monthly">月统计</option>
                    <option value="yearly">年统计</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-search mr-2"></i>查询
                </button>
            </div>
        </form>

        <!-- Loading indicator -->
        <div id="loading" class="hidden">
            <div class="flex items-center justify-center py-8">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <span class="ml-3 text-gray-600">正在加载数据...</span>
            </div>
        </div>

        <!-- Data table -->
        <div id="data-container">
            <div class="text-center py-12 text-gray-500">
                <i class="fas fa-chart-bar text-4xl mb-4"></i>
                <p>选择筛选条件后点击查询按钮获取上交所市场数据</p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize volume chart
    const volumeCtx = document.getElementById('volumeChart').getContext('2d');
    new Chart(volumeCtx, {
        type: 'bar',
        data: {
            labels: ['周一', '周二', '周三', '周四', '周五'],
            datasets: [{
                label: '成交金额(万亿)',
                data: [0.8, 1.2, 1.0, 1.5, 1.3],
                backgroundColor: 'rgba(59, 130, 246, 0.8)',
                borderColor: 'rgb(59, 130, 246)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    // Initialize index chart
    const indexCtx = document.getElementById('indexChart').getContext('2d');
    new Chart(indexCtx, {
        type: 'line',
        data: {
            labels: ['9:30', '10:00', '10:30', '11:00', '13:00', '13:30', '14:00', '14:30', '15:00'],
            datasets: [{
                label: '上证指数',
                data: [3100, 3120, 3115, 3125, 3130, 3140, 3135, 3145, 3150],
                borderColor: 'rgb(239, 68, 68)',
                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: false
                }
            }
        }
    });

    // Form submission
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loading').classList.remove('hidden');
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('data-container').innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">成交金额</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">成交量</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上涨家数</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">下跌家数</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上证指数</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">2024-01-15</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-600">1.25万亿</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">150亿股</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600">1250</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600">980</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">3150.25</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }, 1500);
        });
    }
});
</script>
{% endblock %}
