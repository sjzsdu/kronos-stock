{% extends "layouts/dashboard.html" %}

{% block content %}
<div class="container p-6">
    <!-- Page header -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <i class="fas fa-industry text-indigo-500"></i>
            行业成交数据
        </h1>
        <p class="text-gray-600 mt-2">按行业分类的交易统计数据</p>
    </div>

    <!-- HTMX loading container -->
    <div id="industry-data-container" 
         hx-get="{{ url_for('views.htmx_market_industry') }}" 
         hx-trigger="load" 
         hx-swap="innerHTML">
        <div class="bg-white rounded-xl shadow-lg p-8 text-center">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-indigo-600 rounded-full" role="status" aria-label="loading">
                <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-4 text-gray-600">正在加载行业成交数据...</p>
        </div>
    </div>
</div>
{% endblock %}
