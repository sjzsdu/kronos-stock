<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>{% block title %}仪表板 - Kronos 智能投资平台{% endblock %}</title>
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token else '' }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tw.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    
    <!-- Charts -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body class="dashboard-layout">
    <div class="dashboard-container">
        <!-- 侧边栏组件 -->
        {% include 'components/sidebar.html' %}
        
        <!-- 主要内容区域 -->
        <div class="dashboard-main">
            <!-- 顶部导航栏 -->
            <header class="dashboard-header">
                <div class="dashboard-header__content">
                    <!-- 移动端菜单按钮 -->
                    <button id="sidebar-toggle" class="dashboard-header__toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    
                    <!-- 页面标题 -->
                    <div class="dashboard-header__title">
                        <h1>{% block page_title %}仪表板{% endblock %}</h1>
                    </div>
                    
                    <!-- 右侧工具栏 -->
                    <div class="flex items-center space-x-4">
                        <!-- 通知 -->
                        <button class="relative p-2 text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fas fa-bell text-lg"></i>
                            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        
                        <!-- 用户菜单 -->
                        <div class="relative">
                            <button class="flex items-center space-x-2 p-2 text-gray-700 hover:text-gray-900 focus:outline-none" onclick="toggleUserMenu()">
                                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-white text-sm"></i>
                                </div>
                                <i class="fas fa-chevron-down text-xs hidden sm:block"></i>
                            </button>
                            <div id="user-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg opacity-0 invisible transition-all duration-200 z-50">
                                <div class="py-1">
                                    <a href="{{ url_for('user_views.profile_page') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                                        个人资料
                                    </a>
                                    <a href="{{ url_for('user_views.settings_page') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                                        系统设置
                                    </a>
                                    <div class="border-t border-gray-100"></div>
                                    <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                                        退出登录
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 主要内容 -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
                <div class="container mx-auto px-4 py-6">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- 通用脚本 -->
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/htmx-config.js') }}"></script>
    
    <!-- 仪表板布局脚本 -->
    <script>
        // 侧边栏控制
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebarClose = document.getElementById('sidebar-close');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            
            function openSidebar() {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            }
            
            function closeSidebar() {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
            
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', openSidebar);
            }
            
            if (sidebarClose) {
                sidebarClose.addEventListener('click', closeSidebar);
            }
            
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', closeSidebar);
            }
        });
        
        // 导航组展开/收起功能已移至sidebar组件
        
        // 用户菜单展开/收起
        function toggleUserMenu() {
            const userMenu = document.getElementById('user-menu');
            if (userMenu) {
                userMenu.classList.toggle('opacity-0');
                userMenu.classList.toggle('invisible');
            }
        }
        
        // 点击外部关闭用户菜单
        document.addEventListener('click', function(event) {
            const userMenu = document.getElementById('user-menu');
            const userMenuButton = event.target.closest('button[onclick="toggleUserMenu()"]');
            
            if (userMenu && !userMenuButton && !userMenu.contains(event.target)) {
                userMenu.classList.add('opacity-0');
                userMenu.classList.add('invisible');
            }
        });
        
        // HTMX 全局配置
        document.body.addEventListener('htmx:configRequest', function(evt) {
            // 添加 CSRF Token
            const csrfToken = document.querySelector('meta[name=csrf-token]');
            if (csrfToken) {
                evt.detail.headers['X-CSRFToken'] = csrfToken.getAttribute('content');
            }
        });
        
        // 处理认证错误
        document.body.addEventListener('htmx:responseError', function(evt) {
            if (evt.detail.xhr.status === 401) {
                window.location.href = '/auth/login';
            } else if (evt.detail.xhr.status === 403) {
                console.error('Access denied');
            }
        });
    </script>
    


    {% block scripts %}{% endblock %}
</body>
</html>
