{% extends "layouts/auth.html" %}

{% block title %}用户注册 - Kronos 智能投资平台{% endblock %}

{% block head %}
<style>
    /* 注册页面专用样式 */
    .register-container {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    
    .register-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .brand-logo {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    .password-strength {
        height: 4px;
        border-radius: 2px;
        transition: all 0.3s ease;
    }
    
    .strength-weak { background-color: #ef4444; }
    .strength-fair { background-color: #f59e0b; }
    .strength-good { background-color: #10b981; }
    .strength-strong { background-color: #059669; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth__wrapper">
        <!-- 注册卡片 -->
        <div class="card register-card">
            <!-- Logo和标题 -->
            <div class="card__header text-center">
                <div class="auth__logo">
                    <span class="auth__logo-text">K</span>
                </div>
                <h2 class="auth__title brand-logo">
                    Kronos
                </h2>
                <p class="auth__subtitle">
                    创建您的智能投资账户
                </p>
            </div>

            <!-- 注册表单 -->
            <form id="register-form" 
                  hx-post="/api/auth/register"
                  hx-ext="json-enc"
                  hx-target="#register-messages"
                  hx-swap="innerHTML"
                  hx-on:htmx:after-request="handleRegisterResponse(event)"
                  class="form">
                
                <!-- 错误/成功消息区域 -->
                <div id="register-messages" class="notification-area notification-area--hidden"></div>

                <div class="card__body">
                    <!-- 昵称输入 -->
                    <div class="form-group">
                        <label for="nickname" class="form-label">
                            <i class="fas fa-user form__icon"></i>
                            昵称
                        </label>
                        <input id="nickname" 
                               name="nickname" 
                               type="text" 
                               required
                               maxlength="20"
                               pattern="^[a-zA-Z0-9\u4e00-\u9fa5_-]{2,20}$"
                               oninput="validateNickname(this)"
                               class="form-input"
                               placeholder="请输入昵称（2-20个字符）">
                        <div id="nickname-error" class="form-error hidden"></div>
                        <div class="form-help">支持中英文、数字、下划线和连字符</div>
                    </div>

                    <!-- 邮箱输入 -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope form__icon"></i>
                            邮箱地址
                        </label>
                        <input id="email" 
                               name="email" 
                               type="email" 
                               required
                               autocomplete="email"
                               oninput="validateEmail(this)"
                               class="form-input"
                               placeholder="请输入邮箱地址">
                        <div id="email-error" class="form-error hidden"></div>
                    </div>

                    <!-- 密码输入 -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock form__icon"></i>
                            密码
                        </label>
                        <div class="form-input-group">
                            <input id="password" 
                                   name="password" 
                                   type="password" 
                                   required
                                   minlength="8"
                                   autocomplete="new-password"
                                   oninput="checkPasswordStrength(this.value)"
                                   class="form-input form-input--with-button"
                                   placeholder="请输入密码（至少8位）">
                            <button type="button" 
                                    onclick="togglePassword('password')"
                                    class="form-input-button">
                                <i class="fas fa-eye" id="password-eye"></i>
                            </button>
                        </div>
                        <!-- 密码强度指示器 -->
                        <div class="form__password-strength">
                            <div class="password-strength w-full bg-gray-200" id="password-strength-bar"></div>
                            <div class="form__password-info">
                                <span id="password-strength-text">请输入密码</span>
                                <span id="password-requirements" class="text-right">至少8位，包含字母和数字</span>
                            </div>
                        </div>
                    </div>

                    <!-- 确认密码输入 -->
                    <div class="form-group">
                        <label for="confirm-password" class="form-label">
                            <i class="fas fa-lock form__icon"></i>
                            确认密码
                        </label>
                        <div class="form-input-group">
                            <input id="confirm-password" 
                                   name="confirm_password" 
                                   type="password" 
                                   required
                                   autocomplete="new-password"
                                   oninput="validatePasswordMatch()"
                                   class="form-input form-input--with-button"
                                   placeholder="请再次输入密码">
                            <button type="button" 
                                    onclick="togglePassword('confirm-password')"
                                    class="form-input-button">
                                <i class="fas fa-eye" id="confirm-password-eye"></i>
                            </button>
                        </div>
                        <div id="password-match-error" class="form-error hidden"></div>
                    </div>

                    <!-- 服务条款同意 -->
                    <div class="form-checkbox-group">
                        <input id="agree-terms" 
                               name="agree_terms" 
                               type="checkbox"
                               required
                               class="form-checkbox">
                        <label for="agree-terms" class="form-checkbox-label">
                            我已阅读并同意
                            <a href="{{ url_for('legal.terms') }}" target="_blank" class="link link--primary">服务条款</a>
                            和
                            <a href="{{ url_for('legal.privacy') }}" target="_blank" class="link link--primary">隐私政策</a>
                        </label>
                    </div>
                </div>

                <!-- 注册按钮 -->
                <div class="card__footer">
                    <button type="submit" 
                            id="register-button"
                            class="btn btn--primary btn--full-width btn--with-icon">
                        <span class="btn__icon">
                            <i class="fas fa-user-plus" aria-hidden="true"></i>
                        </span>
                        <span id="register-text">创建账户</span>
                        <span id="register-loading" class="hidden">
                            <i class="fas fa-spinner fa-spin"></i>
                            注册中...
                        </span>
                    </button>
                </div>

                <!-- 登录链接 -->
                <div class="text-center">
                    <p class="text--secondary">
                        已有账户？
                        <a href="{{ url_for('auth.login') }}" 
                           class="link link--primary">
                            立即登录
                        </a>
                    </p>
                </div>
            </form>
        </div>

        <!-- 底部链接 -->
        <div class="auth__footer">
            <p class="auth__footer-text">
                注册即表示您同意我们的
                <a href="{{ url_for('legal.terms') }}" target="_blank" class="link link--light">服务条款</a>
                和
                <a href="{{ url_for('legal.privacy') }}" target="_blank" class="link link--light">隐私政策</a>
            </p>
        </div>
    </div>
</div>

<script>
// 注册页面交互逻辑
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(inputId + '-eye');
    
    if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        eye.className = 'fas fa-eye';
    }
}

// 验证昵称
function validateNickname(input) {
    const errorDiv = document.getElementById('nickname-error');
    const pattern = /^[a-zA-Z0-9\u4e00-\u9fa5_-]{2,20}$/;
    
    if (input.value.length === 0) {
        hideError(errorDiv);
        return;
    }
    
    if (!pattern.test(input.value)) {
        showError(errorDiv, '昵称格式不正确，请使用2-20个中英文字符、数字、下划线或连字符');
        return false;
    }
    
    hideError(errorDiv);
    return true;
}

// 验证邮箱
function validateEmail(input) {
    const errorDiv = document.getElementById('email-error');
    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    if (input.value.length === 0) {
        hideError(errorDiv);
        return;
    }
    
    if (!pattern.test(input.value)) {
        showError(errorDiv, '请输入有效的邮箱地址');
        return false;
    }
    
    hideError(errorDiv);
    return true;
}

// 检查密码强度
function checkPasswordStrength(password) {
    const strengthBar = document.getElementById('password-strength-bar');
    const strengthText = document.getElementById('password-strength-text');
    
    if (!password) {
        strengthBar.className = 'password-strength w-full bg-gray-200';
        strengthText.textContent = '请输入密码';
        return;
    }
    
    let score = 0;
    const checks = {
        length: password.length >= 8,
        lowercase: /[a-z]/.test(password),
        uppercase: /[A-Z]/.test(password),
        number: /\d/.test(password),
        special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
    };
    
    // 计算得分
    score += checks.length ? 1 : 0;
    score += checks.lowercase ? 1 : 0;
    score += checks.uppercase ? 1 : 0;
    score += checks.number ? 1 : 0;
    score += checks.special ? 1 : 0;
    
    // 长度加分
    if (password.length >= 12) score += 1;
    if (password.length >= 16) score += 1;
    
    // 设置强度显示
    let strengthClass = 'password-strength w-full ';
    let strengthLabel = '';
    
    if (score <= 2) {
        strengthClass += 'strength-weak';
        strengthLabel = '弱';
    } else if (score <= 4) {
        strengthClass += 'strength-fair';
        strengthLabel = '一般';
    } else if (score <= 6) {
        strengthClass += 'strength-good';
        strengthLabel = '良好';
    } else {
        strengthClass += 'strength-strong';
        strengthLabel = '强';
    }
    
    strengthBar.className = strengthClass;
    strengthText.textContent = `密码强度：${strengthLabel}`;
    
    return score >= 3;
}

// 验证密码匹配
function validatePasswordMatch() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const errorDiv = document.getElementById('password-match-error');
    
    if (!confirmPassword) {
        hideError(errorDiv);
        return;
    }
    
    if (password !== confirmPassword) {
        showError(errorDiv, '两次输入的密码不一致');
        return false;
    }
    
    hideError(errorDiv);
    return true;
}

// 显示错误
function showError(element, message) {
    element.textContent = message;
    element.classList.remove('hidden');
}

// 隐藏错误
function hideError(element) {
    element.classList.add('hidden');
}

// 处理注册响应
function handleRegisterResponse(event) {
    const xhr = event.detail.xhr;
    const button = document.getElementById('register-button');
    const registerText = document.getElementById('register-text');
    const registerLoading = document.getElementById('register-loading');
    const messagesDiv = document.getElementById('register-messages');
    
    // 重置按钮状态
    button.disabled = false;
    registerText.classList.remove('hidden');
    registerLoading.classList.add('hidden');
    
    try {
        const response = JSON.parse(xhr.responseText);
        
        if (xhr.status === 201 && response.success) {
            // 注册成功
            messagesDiv.innerHTML = `
                <div class="alert alert-success">
                    <div class="alert__icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="alert__content">
                        <p class="alert__message">
                            注册成功！${response.message || '正在跳转到登录页面...'}
                        </p>
                    </div>
                </div>
            `;
            messagesDiv.classList.remove('notification-area--hidden');
            
            // 跳转到登录页面
            setTimeout(() => {
                window.location.href = '/auth/login';
            }, 2000);
        } else {
            // 注册失败
            let message = '注册失败';
            if (response.errors && Array.isArray(response.errors)) {
                message = response.errors.join('<br>');
            } else if (response.message) {
                message = response.message;
            }
            showErrorMessage(message);
        }
    } catch (error) {
        showErrorMessage('注册请求失败，请稍后重试');
    }
}

// 显示错误消息
function showErrorMessage(message) {
    const messagesDiv = document.getElementById('register-messages');
    messagesDiv.innerHTML = `
        <div class="alert alert-error">
            <div class="alert__icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <div class="alert__content">
                <p class="alert__message">
                    ${message}
                </p>
            </div>
        </div>
    `;
    messagesDiv.classList.remove('notification-area--hidden');
}

// 表单提交前验证
function validateForm() {
    let isValid = true;
    
    // 验证昵称
    const nickname = document.getElementById('nickname');
    if (!validateNickname(nickname)) {
        isValid = false;
    }
    
    // 验证邮箱
    const email = document.getElementById('email');
    if (!validateEmail(email)) {
        isValid = false;
    }
    
    // 验证密码强度
    const password = document.getElementById('password').value;
    if (!checkPasswordStrength(password)) {
        showErrorMessage('密码强度不够，请使用更复杂的密码');
        isValid = false;
    }
    
    // 验证密码匹配
    if (!validatePasswordMatch()) {
        isValid = false;
    }
    
    // 验证服务条款同意
    const agreeTerms = document.getElementById('agree-terms');
    if (!agreeTerms.checked) {
        showErrorMessage('请先阅读并同意服务条款和隐私政策');
        isValid = false;
    }
    
    return isValid;
}

// 表单提交时显示加载状态和验证
document.getElementById('register-form').addEventListener('htmx:before-request', function(event) {
    if (!validateForm()) {
        event.preventDefault();
        return false;
    }
    
    const button = document.getElementById('register-button');
    const registerText = document.getElementById('register-text');
    const registerLoading = document.getElementById('register-loading');
    
    button.disabled = true;
    registerText.classList.add('hidden');
    registerLoading.classList.remove('hidden');
});

// 页面加载时检查是否已登录
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('auth_token');
    if (token) {
        // 验证token是否有效
        fetch('/api/user/profile', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (response.ok) {
                // 已登录，跳转到仪表板
                window.location.href = '/user/dashboard';
            }
        })
        .catch(() => {
            // token无效，清除
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_id');
        });
    }
});
</script>
{% endblock %}
