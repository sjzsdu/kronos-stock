{% extends "layouts/auth.html" %}

{% block title %}用户登录 - Kronos 智能投资平台{% endblock %}

{% block head %}
<!-- 使用语义化CSS类，无需内联样式 -->
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth__wrapper">
        <!-- 登录卡片 -->
        <div class="card login-card">
            <!-- Logo和标题 -->
            <div class="card__header text-center">
                <div class="auth__logo">
                    <span class="auth__logo-text">K</span>
                </div>
                <h2 class="auth__title brand-logo">
                    Kronos
                </h2>
                <p class="auth__subtitle">
                    登录您的智能投资账户
                </p>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" 
                  hx-post="/api/auth/login"
                  hx-ext="json-enc"
                  hx-target="#login-messages"
                  hx-swap="innerHTML"
                  hx-on:htmx:after-request="handleLoginResponse(event)"
                  class="form">
                
                <!-- 错误/成功消息区域 -->
                <div id="login-messages" class="notification-area notification-area--hidden"></div>

                <div class="card__body">
                    <!-- 邮箱输入 -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            邮箱地址
                        </label>
                        <input id="email" 
                               name="email" 
                               type="email" 
                               required
                               autocomplete="email"
                               class="form-input"
                               placeholder="请输入邮箱地址">
                    </div>

                    <!-- 密码输入 -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            密码
                        </label>
                        <div class="form-input-group">
                            <input id="password" 
                                   name="password" 
                                   type="password" 
                                   required
                                   autocomplete="current-password"
                                   class="form-input"
                                   placeholder="请输入密码">
                            <button type="button" 
                                    onclick="togglePassword('password')"
                                    class="form-input-button">
                                <i class="fas fa-eye" id="password-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 记住我和忘记密码 -->
                    <div class="form-actions">
                        <div class="form-checkbox-group">
                            <input id="remember-me" 
                                   name="remember_me" 
                                   type="checkbox"
                                   class="form-checkbox">
                            <label for="remember-me" class="form-checkbox-label">
                                记住我
                            </label>
                        </div>
                        <div>
                            <a href="{{ url_for('auth.reset_password') }}" 
                               class="link link--primary">
                                忘记密码？
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <div class="card__footer">
                    <button type="submit" 
                            id="login-button"
                            class="btn-primary btn--lg w-full">
                        <span id="login-text">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            立即登录
                        </span>
                        <span id="login-loading" class="btn--loading hidden">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            登录中...
                        </span>
                    </button>
                </div>

                <!-- 注册链接 -->
                <div class="text-center">
                    <p class="text--secondary">
                        还没有账户？
                        <a href="{{ url_for('auth.register') }}" 
                           class="link link--primary">
                            立即注册
                        </a>
                    </p>
                </div>
            </form>
        </div>

        <!-- 底部链接 -->
        <div class="auth__footer">
            <p class="auth__footer-text">
                登录即表示您同意我们的
                <a href="{{ url_for('legal.terms') }}" target="_blank" class="link link--light">服务条款</a>
                和
                <a href="{{ url_for('legal.privacy') }}" target="_blank" class="link link--light">隐私政策</a>
            </p>
        </div>
    </div>
</div>

<script>
// 登录页面交互逻辑
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(inputId + '-eye');
    
    if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        eye.className = 'fas fa-eye';
    }
}

// 处理登录响应
function handleLoginResponse(event) {
    const xhr = event.detail.xhr;
    const button = document.getElementById('login-button');
    const loginText = document.getElementById('login-text');
    const loginLoading = document.getElementById('login-loading');
    const messagesDiv = document.getElementById('login-messages');
    
    // 重置按钮状态
    button.disabled = false;
    loginText.classList.remove('hidden');
    loginLoading.classList.add('hidden');
    
    try {
        const response = JSON.parse(xhr.responseText);
        
        if (xhr.status === 200 && response.success) {
            // 登录成功
            messagesDiv.innerHTML = `
                <div class="alert alert-success">
                    <div class="alert__icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="alert__content">
                        <p class="alert__message">
                            登录成功！正在跳转...
                        </p>
                    </div>
                </div>
            `;
            messagesDiv.classList.remove('notification-area--hidden');
            
            // 保存token到localStorage
            if (response.token) {
                localStorage.setItem('auth_token', response.token);
                localStorage.setItem('user_id', response.user.id);
            }
            
            // 跳转到仪表板
            setTimeout(() => {
                window.location.href = '/user/dashboard';
            }, 1000);
        } else {
            // 登录失败
            showError(response.message || '登录失败，请检查邮箱和密码');
        }
    } catch (error) {
        showError('登录请求失败，请稍后重试');
    }
}

// 显示错误消息
function showError(message) {
    const messagesDiv = document.getElementById('login-messages');
    messagesDiv.innerHTML = `
        <div class="alert alert-error">
            <div class="alert__icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <div class="alert__content">
                <p class="alert__message">
                    ${message}
                </p>
            </div>
        </div>
    `;
    messagesDiv.classList.remove('notification-area--hidden');
}

// 表单提交时显示加载状态
document.getElementById('login-form').addEventListener('htmx:before-request', function() {
    const button = document.getElementById('login-button');
    const loginText = document.getElementById('login-text');
    const loginLoading = document.getElementById('login-loading');
    
    button.disabled = true;
    loginText.classList.add('hidden');
    loginLoading.classList.remove('hidden');
});

// 页面加载时检查是否已登录
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('auth_token');
    if (token) {
        // 验证token是否有效
        fetch('/api/user/profile', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (response.ok) {
                // 已登录，跳转到仪表板
                window.location.href = '/user/dashboard';
            }
        })
        .catch(() => {
            // token无效，清除
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_id');
        });
    }
});
</script>
{% endblock %}
