{% extends "layouts/base.html" %}

{% block title %}用户登录 - Kronos 智能投资平台{% endblock %}

{% block head %}
<style>
    /* 登录页面专用样式 */
    .login-container {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    
    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .brand-logo {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
</style>
{% endblock %}

{% block body %}
<div class="login-container flex items-center justify-center p-4">
    <div class="max-w-md w-full space-y-8">
        <!-- 登录卡片 -->
        <div class="login-card rounded-2xl shadow-xl p-8">
            <!-- Logo和标题 -->
            <div class="text-center mb-8">
                <div class="mx-auto h-12 w-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center mb-4">
                    <span class="text-white text-xl font-bold">K</span>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 brand-logo">
                    Kronos
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    登录您的智能投资账户
                </p>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" 
                  hx-post="/api/auth/login"
                  hx-ext="json-enc"
                  hx-target="#login-messages"
                  hx-swap="innerHTML"
                  hx-on:htmx:after-request="handleLoginResponse(event)"
                  class="space-y-6">
                
                <!-- 错误/成功消息区域 -->
                <div id="login-messages" class="hidden"></div>

                <div class="space-y-4">
                    <!-- 邮箱输入 -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-1 text-gray-400"></i>
                            邮箱地址
                        </label>
                        <input id="email" 
                               name="email" 
                               type="email" 
                               required
                               autocomplete="email"
                               class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="请输入邮箱地址">
                    </div>

                    <!-- 密码输入 -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-1 text-gray-400"></i>
                            密码
                        </label>
                        <div class="relative">
                            <input id="password" 
                                   name="password" 
                                   type="password" 
                                   required
                                   autocomplete="current-password"
                                   class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors pr-10"
                                   placeholder="请输入密码">
                            <button type="button" 
                                    onclick="togglePassword('password')"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye" id="password-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 记住我和忘记密码 -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" 
                                   name="remember_me" 
                                   type="checkbox"
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                                记住我
                            </label>
                        </div>
                        <div class="text-sm">
                            <a href="{{ url_for('auth.reset_password') }}" 
                               class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
                                忘记密码？
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <div>
                    <button type="submit" 
                            id="login-button"
                            class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-sign-in-alt group-hover:text-blue-300 transition-colors" aria-hidden="true"></i>
                        </span>
                        <span id="login-text">立即登录</span>
                        <span id="login-loading" class="hidden">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            登录中...
                        </span>
                    </button>
                </div>

                <!-- 注册链接 -->
                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        还没有账户？
                        <a href="{{ url_for('auth.register') }}" 
                           class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
                            立即注册
                        </a>
                    </p>
                </div>
            </form>
        </div>

        <!-- 底部链接 -->
        <div class="text-center">
            <p class="text-xs text-white/80">
                登录即表示您同意我们的
                <a href="#" class="text-white underline hover:no-underline">服务条款</a>
                和
                <a href="#" class="text-white underline hover:no-underline">隐私政策</a>
            </p>
        </div>
    </div>
</div>

<script>
// 登录页面交互逻辑
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(inputId + '-eye');
    
    if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        eye.className = 'fas fa-eye';
    }
}

// 处理登录响应
function handleLoginResponse(event) {
    const xhr = event.detail.xhr;
    const button = document.getElementById('login-button');
    const loginText = document.getElementById('login-text');
    const loginLoading = document.getElementById('login-loading');
    const messagesDiv = document.getElementById('login-messages');
    
    // 重置按钮状态
    button.disabled = false;
    loginText.classList.remove('hidden');
    loginLoading.classList.add('hidden');
    
    try {
        const response = JSON.parse(xhr.responseText);
        
        if (xhr.status === 200 && response.success) {
            // 登录成功
            messagesDiv.innerHTML = `
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-check-circle text-green-400"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium text-green-800">
                                登录成功！正在跳转...
                            </p>
                        </div>
                    </div>
                </div>
            `;
            messagesDiv.classList.remove('hidden');
            
            // 保存token到localStorage
            if (response.token) {
                localStorage.setItem('auth_token', response.token);
                localStorage.setItem('user_id', response.user.id);
            }
            
            // 跳转到仪表板
            setTimeout(() => {
                window.location.href = '/user/dashboard';
            }, 1000);
        } else {
            // 登录失败
            showError(response.message || '登录失败，请检查邮箱和密码');
        }
    } catch (error) {
        showError('登录请求失败，请稍后重试');
    }
}

// 显示错误消息
function showError(message) {
    const messagesDiv = document.getElementById('login-messages');
    messagesDiv.innerHTML = `
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-400"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-red-800">
                        ${message}
                    </p>
                </div>
            </div>
        </div>
    `;
    messagesDiv.classList.remove('hidden');
}

// 表单提交时显示加载状态
document.getElementById('login-form').addEventListener('htmx:before-request', function() {
    const button = document.getElementById('login-button');
    const loginText = document.getElementById('login-text');
    const loginLoading = document.getElementById('login-loading');
    
    button.disabled = true;
    loginText.classList.add('hidden');
    loginLoading.classList.remove('hidden');
});

// 页面加载时检查是否已登录
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('auth_token');
    if (token) {
        // 验证token是否有效
        fetch('/api/user/profile', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (response.ok) {
                // 已登录，跳转到仪表板
                window.location.href = '/user/dashboard';
            }
        })
        .catch(() => {
            // token无效，清除
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_id');
        });
    }
});
</script>
{% endblock %}
