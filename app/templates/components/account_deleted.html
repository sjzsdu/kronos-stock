{# 账户删除完成页面 #}
<div class="account-deleted">
    <div class="account-deleted__content">
        <div class="account-deleted__icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h2 class="account-deleted__title">账户已删除</h2>
        
        <div class="account-deleted__message">
            <p>{{ message or '您的账户已成功删除。感谢您使用Kronos股票预测系统。' }}</p>
        </div>
        
        <div class="account-deleted__actions">
            <a href="{{ home_url or '/' }}" class="btn btn--primary">
                <i class="fas fa-home"></i>
                返回首页
            </a>
        </div>
    </div>
</div>

<script>
// 3秒后自动跳转到首页
setTimeout(() => {
    window.location.href = '{{ home_url or "/" }}';
}, 3000);

// 清除本地存储的用户数据
localStorage.clear();
sessionStorage.clear();
</script>
